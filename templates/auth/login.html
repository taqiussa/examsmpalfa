{% extends "layouts/guest.html" %} {% block content %}
<div class="min-h-screen flex flex-col items-center justify-center bg-gradient-to-br from-blue-50 to-gray-100">
  <!-- Login Form -->
  <div class="bg-white p-8 rounded-2xl shadow-lg w-96 border border-gray-200">
    <div class="flex flex-col items-center justify-center">
      <img src="https://is3.cloudhost.id/alfa/smp/public/logo.png" alt="Logo SMP Al Musyaffa" class="w-24" />
      <p class="text-gray-600 text-center mb-6 font-bold text-lg">
        SMP Al Musyaffa
      </p>
    </div>

    <form hx-post="/login" hx-target="#result" hx-swap="innerHTML" hx-on="htmx:afterRequest:
      if (event.detail.xhr.status === 200 && event.detail.xhr.getResponseHeader('HX-Redirect')) {
        window.location = event.detail.xhr.getResponseHeader('HX-Redirect')
      }" class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">
          Username / NIS
        </label>
        <input required name="username"
          class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent transition"
          placeholder="Masukkan username atau NIS" />
      </div>
      <div id="result" class="mt-4 text-sm text-red-600"></div>
      <div x-data="{ show: false }">
        <label class="block text-sm font-medium text-gray-700 mb-1">
          Password
        </label>

        <div class="relative">
          <input required :type="show ? 'text' : 'password'" name="password"
            class="w-full px-4 py-2.5 pr-12 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent transition"
            placeholder="Masukkan password" />

          <button type="button" @click="show = !show"
            class="absolute inset-y-0 right-0 px-3 flex items-center text-gray-500 hover:text-gray-700">
            <!-- eye -->
            <svg x-show="!show" xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24"
              stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M15 12a3 3 0 11-6 0 3 3 0 016 0zm7.938 0C21.045 7.477 16.94 4.5 12 4.5S2.955 7.477 1.062 12C2.955 16.523 7.06 19.5 12 19.5s9.045-2.977 10.938-7.5z" />
            </svg>

            <!-- eye off -->
            <svg x-show="show" xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24"
              stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M13.875 18.825A10.05 10.05 0 0112 19.5C7.06 19.5 2.955 16.523 1.062 12a10.05 10.05 0 012.243-3.592m3.122-2.363A9.956 9.956 0 0112 4.5c4.94 0 9.045 2.977 10.938 7.5a9.96 9.96 0 01-4.293 5.162M15 12a3 3 0 00-4.243-4.243M3 3l18 18" />
            </svg>
          </button>
        </div>
      </div>


      <button type="submit"
        class="w-full bg-gradient-to-r from-blue-600 to-blue-700 text-white font-semibold py-3 px-4 rounded-lg hover:from-blue-700 hover:to-blue-800 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 transition-all">
        Login
      </button>
    </form>
  </div>
</div>
{% endblock %}
