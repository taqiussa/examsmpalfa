{% extends "layouts/guest.html" %} {% block content %}
<div
  class="min-h-screen flex flex-col items-center justify-center bg-gradient-to-br from-blue-50 to-gray-100"
>
  <!-- Login Form -->
  <div class="bg-white p-8 rounded-2xl shadow-lg w-96 border border-gray-200">
    <div class="flex flex-col items-center justify-center">
      <img
        src="https://is3.cloudhost.id/alfa/smpmifda/public/logo.png"
        alt="Logo SMP Miftahul Huda Peron"
        class="w-24"
      />
      <p class="text-gray-600 text-center mb-6 font-bold text-lg">
        SMP Miftahul Huda Peron
      </p>
    </div>

    <form
      hx-post="/login"
      hx-target="#result"
      hx-swap="innerHTML"
      hx-on="htmx:afterRequest:
      if (event.detail.xhr.status === 200 && event.detail.xhr.getResponseHeader('HX-Redirect')) {
        window.location = event.detail.xhr.getResponseHeader('HX-Redirect')
      }"
      class="space-y-4"
    >
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">
          Username
        </label>
        <input
          required
          name="username"
          class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent transition"
          placeholder="Masukkan username"
        />
      </div>
      <div id="result" class="mt-4 text-sm text-red-600"></div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">
          Password
        </label>
        <input
          required
          type="password"
          name="password"
          class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent transition"
          placeholder="Masukkan password"
        />
      </div>

      <button
        type="submit"
        class="w-full bg-gradient-to-r from-blue-600 to-blue-700 text-white font-semibold py-3 px-4 rounded-lg hover:from-blue-700 hover:to-blue-800 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 transition-all"
      >
        Login
      </button>
    </form>
  </div>
</div>
{% endblock %}
