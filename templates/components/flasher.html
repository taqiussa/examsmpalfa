<style>
  [x-cloak] {
    display: none !important;
  }
</style>

<div
  x-data="{ now: Date.now() }"
  x-init="setInterval(() => { now = Date.now() }, 200)"
  class="fixed top-4 right-4 z-50 flex flex-col gap-3 max-w-sm w-[calc(100vw-2rem)]"
  x-cloak
>
  <template x-for="toast in $store.flash.items" :key="toast.id">
    <div
      class="relative bg-white border-l-4 shadow-lg rounded-lg px-4 py-3 text-sm text-gray-800"
      :class="{
        'border-emerald-500': toast.type === 'success',
        'border-rose-500': toast.type === 'error',
        'border-amber-500': toast.type === 'warning',
        'border-sky-500': toast.type === 'info'
      }"
      x-transition:enter="transition ease-out duration-200"
      x-transition:enter-start="opacity-0 translate-y-2"
      x-transition:enter-end="opacity-100 translate-y-0"
      x-transition:leave="transition ease-in duration-150"
      x-transition:leave-start="opacity-100 translate-y-0"
      x-transition:leave-end="opacity-0 translate-y-2"
    >
      <div class="flex items-start gap-3">
        <div
          class="mt-0.5 h-2.5 w-2.5 rounded-full"
          :class="{
            'bg-emerald-500': toast.type === 'success',
            'bg-rose-500': toast.type === 'error',
            'bg-amber-500': toast.type === 'warning',
            'bg-sky-500': toast.type === 'info'
          }"
        ></div>
        <div class="flex-1 leading-5">
          <div class="font-semibold capitalize" x-text="toast.type"></div>
          <div class="text-gray-600" x-text="toast.message"></div>
          <div
            class="mt-1 text-xs text-gray-500"
            x-show="toast.timeout > 0"
            x-text="`Tutup dalam ${Math.max(0, Math.ceil((toast.createdAt + toast.timeout - now) / 1000))}s`"
          ></div>
        </div>
        <button
          type="button"
          class="text-gray-400 hover:text-gray-700 transition"
          @click="$store.flash.remove(toast.id)"
          aria-label="Close"
        >
          ✕
        </button>
      </div>
      <div
        class="absolute bottom-0 left-0 h-0.5 w-full origin-left-right"
        :class="{
          'bg-emerald-400': toast.type === 'success',
          'bg-rose-400': toast.type === 'error',
          'bg-amber-400': toast.type === 'warning',
          'bg-sky-400': toast.type === 'info'
        }"
        style="transform-origin: 0% 50%"
        x-show="toast.timeout > 0"
        x-transition
      >
        <div
          class="h-full w-full animate-progress"
          :style="toast.timeout > 0 ? `animation-duration: ${toast.timeout}ms` : ''"
        ></div>
      </div>
    </div>
  </template>
</div>
