<div class="flex flex-col space-y-1 text-md text-slate-600">
  <label class="text-sm text-slate-600">Ujian</label>
  <select name="ujian_id" class="input" required>
    <option value="">Pilih ujian...</option>
    {% for ujian in data.list_ujian %}
    <option value="{{ ujian.id }}" data-mata-pelajaran-id="{{ ujian.mata_pelajaran_id }}" {% if data.ujian_id==ujian.id %}selected{% endif %}>
      {{ ujian.title }} — {{ ujian.mata_pelajaran }} ({{ ujian.tahun }})
    </option>
    {% endfor %}
  </select>
</div>
