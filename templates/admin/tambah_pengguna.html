{% extends "layouts/app.html" %}

{% block content %}
<div class="card space-y-6">
        <h1 class="card-header">Tambah Pengguna</h1>

        {% set form_name = data.name %}
        {% set form_username = data.username %}
        {% set form_errors = data.errors %}
        {% include "admin/_tambah_pengguna_form.html" %}

        <div class="pt-4 border-t">
                <h2 class="text-lg font-semibold mb-3">Data Pengguna</h2>
                <div id="pengguna-table-wrap" hx-get="/tambah-pengguna/table"
                        hx-trigger="load, pengguna:changed from:body" hx-target="#pengguna-table-wrap"
                        hx-swap="innerHTML">
                </div>
        </div>
</div>
{% endblock %}
