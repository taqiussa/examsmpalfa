{% if data.active_ujian %}
<div class="bg-white border border-slate-200 rounded-lg p-4 flex flex-wrap items-center gap-3">
        <div class="text-sm text-slate-500">Ujian Aktif:</div>
        <div class="font-semibold">
                {{ data.active_ujian.mata_pelajaran | default(value="-") }} - {{ data.active_ujian.title }}
        </div>
        <span class="px-3 py-1 rounded-full text-sm bg-emerald-100 text-emerald-700">Aktif</span>
        <form hx-post="/ujian/{{ data.active_ujian.id }}/toggle-active" hx-swap="none">
                <input type="hidden" name="active" value="0">
                <button type="submit" class="button bg-slate-600 text-white hover:bg-slate-700">
                        Nonaktifkan
                </button>
        </form>
</div>
{% else %}
<div class="text-sm text-slate-500">Belum ada ujian aktif.</div>
{% endif %}
