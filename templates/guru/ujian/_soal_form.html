<div id="soal-form-container" class="card space-y-6 max-w-4xl mx-auto">

        <div class="flex items-center gap-4">
                <a href="/ujian/{{ data.ujian_id }}" class="text-slate-500 hover:text-slate-700">
                        ← Kembali ke Ujian
                </a>
                <h1 class="card-header">Tambah Soal untuk: {{ data.ujian_title }}</h1>
        </div>

        <form id="soal-form" method="post" hx-post="/ujian/{{ data.ujian_id }}/soal/store" class="space-y-6">

                <!-- Pertanyaan with Quill Editor -->
                <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">
                                Pertanyaan <span class="text-rose-500">*</span>
                        </label>
                        <input type="hidden" name="pertanyaan" id="pertanyaan-input" value="{{ data.pertanyaan }}">
                        <div id="quill-editor" class="bg-white" style="height: 200px;"></div>
                </div>

                <!-- Options -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                                <label class="block text-sm font-medium text-slate-700 mb-1">
                                        Opsi A <span class="text-emerald-500">✓</span>
                                </label>
                                <input type="text" name="opsi_a" value="{{ data.opsi_a }}" placeholder="Jawaban opsi A"
                                        class="input w-full" required>
                        </div>

                        <div>
                                <label class="block text-sm font-medium text-slate-700 mb-1">
                                        Opsi B
                                </label>
                                <input type="text" name="opsi_b" value="{{ data.opsi_b }}" placeholder="Jawaban opsi B"
                                        class="input w-full" required>
                        </div>

                        <div>
                                <label class="block text-sm font-medium text-slate-700 mb-1">
                                        Opsi C
                                </label>
                                <input type="text" name="opsi_c" value="{{ data.opsi_c }}" placeholder="Jawaban opsi C"
                                        class="input w-full">
                        </div>

                        <div>
                                <label class="block text-sm font-medium text-slate-700 mb-1">
                                        Opsi D
                                </label>
                                <input type="text" name="opsi_d" value="{{ data.opsi_d }}" placeholder="Jawaban opsi D"
                                        class="input w-full">
                        </div>
                </div>

                <!-- Jawaban Benar & Metadata -->
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                        <div>
                                <label class="block text-sm font-medium text-slate-700 mb-1">
                                        Kunci Jawaban <span class="text-rose-500">*</span>
                                </label>
                                <select name="kunci_jawaban" class="input w-full" required>
                                        <option value="a" {% if data.kunci_jawaban=='a' %}selected{% endif %}>A</option>
                                        <option value="b" {% if data.kunci_jawaban=='b' %}selected{% endif %}>B</option>
                                        <option value="c" {% if data.kunci_jawaban=='c' %}selected{% endif %}>C</option>
                                        <option value="d" {% if data.kunci_jawaban=='d' %}selected{% endif %}>D</option>
                                </select>
                        </div>

                        <div>
                                <label class="block text-sm font-medium text-slate-700 mb-1">
                                        Bobot Nilai
                                </label>
                                <input type="number" name="bobot_nilai" value="{{ data.bobot_nilai }}" min="1" max="100"
                                        value="1" class="input w-full">
                        </div>

                        <div>
                                <label class="block text-sm font-medium text-slate-700 mb-1">
                                        Kategori
                                </label>
                                <input type="text" name="kategori" value="{{ data.kategori }}"
                                        placeholder="Contoh: Pilihan Ganda" class="input w-full">
                        </div>
                </div>

                <!-- Submit Buttons -->
                <div class="flex items-center justify-end gap-3 pt-4 border-t">
                        <a href="/ujian/{{ data.ujian_id }}"
                                class="button bg-slate-100 text-slate-700 hover:bg-slate-200">
                                Batal
                        </a>
                        <button type="submit" class="button bg-sky-600 text-white hover:bg-sky-700">
                                Simpan Soal
                        </button>
                </div>

        </form>

</div>

<!-- Quill.js CDN -->
<link href="https://cdn.quilljs.com/1.3.7/quill.snow.css" rel="stylesheet">
<script src="https://cdn.quilljs.com/1.3.7/quill.min.js"></script>

<script>
        document.addEventListener('DOMContentLoaded', function () {
                // Initialize Quill Editor
                var quill = new Quill('#quill-editor', {
                        theme: 'snow',
                        placeholder: 'Ketik pertanyaan di sini...',
                        modules: {
                                toolbar: [
                                        [{ 'header': [1, 2, 3, false] }],
                                        ['bold', 'italic', 'underline', 'strike'],
                                        [{ 'list': 'ordered' }, { 'list': 'bullet' }],
                                        ['link', 'image'],
                                        ['clean']
                                ]
                        }
                });

                // Get the hidden input
                var pertanyaanInput = document.getElementById('pertanyaan-input');

                // Set initial content if exists
                if (pertanyaanInput && pertanyaanInput.value) {
                        quill.root.innerHTML = pertanyaanInput.value;
                }

                // Update hidden input on form submit
                var form = document.getElementById('soal-form');
                form.addEventListener('submit', function () {
                        pertanyaanInput.value = quill.root.innerHTML;
                });

                // Also update on HTMX request
                form.addEventListener('htmx:beforeRequest', function () {
                        pertanyaanInput.value = quill.root.innerHTML;
                });
        });
</script>

<style>
        /* Quill overrides for Tailwind compatibility */
        .ql-toolbar {
                border-radius: 0.375rem 0.375rem 0 0;
                border-color: #e2e8f0 !important;
                background-color: #f8fafc;
        }

        .ql-container {
                border-radius: 0 0 0.375rem 0.375rem;
                border-color: #e2e8f0 !important;
                font-family: inherit;
                font-size: 0.875rem;
        }

        .ql-editor {
                min-height: 150px;
        }

        .ql-editor.ql-blank::before {
                color: #94a3b8;
                font-style: normal;
        }
</style>
