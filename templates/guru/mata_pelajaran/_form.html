<form id="mata-pelajaran-form" method="post" action="{{ data.action }}" hx-post="{{ data.action }}"
  hx-target="#mata-pelajaran-form" hx-swap="outerHTML" class="space-y-6">
  <div>
    <label for="nama" class="block text-sm font-medium text-slate-700 mb-1">
      Nama Mata Pelajaran <span class="text-rose-500">*</span>
    </label>
    <input id="nama" type="text" name="nama" value="{{ data.nama }}" maxlength="255" autofocus required
      placeholder="Contoh: Matematika"
      class="input w-full {% if data.errors.nama %}border-rose-500{% endif %}">
    {% if data.errors.nama %}
    <p class="text-xs text-rose-500 mt-1">{{ data.errors.nama }}</p>
    {% endif %}
  </div>

  <input type="hidden" name="kelompok" value="E">

  <div class="flex items-center justify-end gap-3 pt-4 border-t">
    <a href="/mata-pelajaran" hx-boost="false"
      class="button bg-slate-100 text-slate-700 hover:bg-slate-200">
      Batal
    </a>
    <button type="submit" class="button bg-emerald-600 text-white hover:bg-emerald-700">
      {{ data.submit_label }}
    </button>
  </div>
</form>
