<table class="w-full rounded-md border border-slate-200 text-sm">
  <thead class="bg-slate-100"><tr><th class="w-16 border px-3 py-2 text-center">No.</th><th class="border px-3 py-2 text-left">NIS</th><th class="border px-3 py-2 text-left">Nama Siswa</th><th class="border px-3 py-2 text-left">Kelas</th><th class="w-48 border px-3 py-2 text-center">Aksi</th></tr></thead>
  <tbody>{% for row in rows %}<tr class="hover:bg-slate-50"><td class="border px-3 py-2 text-center">{{ loop.index }}</td><td class="border px-3 py-2">{{ row.nis }}</td><td class="border px-3 py-2">{{ row.nama }}</td><td class="border px-3 py-2">{{ row.kelas }}</td><td class="border px-3 py-2"><div class="flex items-center justify-center gap-2"><a href="/data-siswa/{{ row.id }}/edit" hx-boost="true" class="rounded-md bg-amber-50 px-3 py-1 text-xs font-semibold text-amber-700 hover:bg-amber-100">Edit</a><form method="post" action="/data-siswa/{{ row.id }}/delete" hx-post="/data-siswa/{{ row.id }}/delete" hx-swap="none" hx-confirm="Hapus data siswa {{ row.nama }}?"><button type="submit" class="rounded-md bg-rose-50 px-3 py-1 text-xs font-semibold text-rose-700 hover:bg-rose-100">Hapus</button></form></div></td></tr>{% else %}<tr><td colspan="5" class="border px-3 py-6 text-center text-slate-500">Belum ada data siswa.</td></tr>{% endfor %}</tbody>
</table>
