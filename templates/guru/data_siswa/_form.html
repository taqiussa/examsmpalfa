<form id="data-siswa-form" method="post" action="{{ data.action }}" hx-post="{{ data.action }}" hx-target="#data-siswa-form" hx-swap="outerHTML" class="space-y-6">
  <div><label for="nis" class="mb-1 block text-sm font-medium text-slate-700">NIS <span class="text-rose-500">*</span></label><input id="nis" type="text" inputmode="numeric" name="nis" value="{{ data.nis }}" maxlength="18" required autofocus class="input w-full {% if data.errors.nis %}border-rose-500{% endif %}">{% if data.errors.nis %}<p class="mt-1 text-xs text-rose-500">{{ data.errors.nis }}</p>{% endif %}</div>
  <div><label for="nama" class="mb-1 block text-sm font-medium text-slate-700">Nama Siswa <span class="text-rose-500">*</span></label><input id="nama" type="text" name="nama" value="{{ data.nama }}" maxlength="255" required class="input w-full {% if data.errors.nama %}border-rose-500{% endif %}">{% if data.errors.nama %}<p class="mt-1 text-xs text-rose-500">{{ data.errors.nama }}</p>{% endif %}</div>
  <div><label for="jenis_kelamin" class="mb-1 block text-sm font-medium text-slate-700">Jenis Kelamin <span class="text-rose-500">*</span></label><select id="jenis_kelamin" name="jenis_kelamin" required class="input w-full {% if data.errors.jenis_kelamin %}border-rose-500{% endif %}"><option value="">Pilih jenis kelamin</option><option value="L" {% if data.jenis_kelamin == "L" %}selected{% endif %}>Laki-laki</option><option value="P" {% if data.jenis_kelamin == "P" %}selected{% endif %}>Perempuan</option></select>{% if data.errors.jenis_kelamin %}<p class="mt-1 text-xs text-rose-500">{{ data.errors.jenis_kelamin }}</p>{% endif %}</div>
  <div><label for="kelas_id" class="mb-1 block text-sm font-medium text-slate-700">Kelas <span class="text-rose-500">*</span></label><select id="kelas_id" name="kelas_id" required class="input w-full {% if data.errors.kelas_id %}border-rose-500{% endif %}"><option value="">Pilih kelas</option>{% for kelas in data.kelas %}<option value="{{ kelas.id }}" {% if data.kelas_id == kelas.id %}selected{% endif %}>{{ kelas.nama }} (Tingkat {{ kelas.tingkat }})</option>{% endfor %}</select>{% if data.errors.kelas_id %}<p class="mt-1 text-xs text-rose-500">{{ data.errors.kelas_id }}</p>{% endif %}</div>
  <div class="flex items-center justify-end gap-3 border-t pt-4"><a href="/data-siswa" hx-boost="false" class="button bg-slate-100 text-slate-700 hover:bg-slate-200">Batal</a><button type="submit" class="button bg-emerald-600 text-white hover:bg-emerald-700">{{ data.submit_label }}</button></div>
</form>
