
name: Deploy SMP Alfa Exam

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: exam-production
  cancel-in-progress: false

jobs:
  build:
    name: Build and Push Docker
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: taqiussa/smpalfa:exam
          cache-from: type=gha,scope=exam
          cache-to: type=gha,mode=max,scope=exam

  deploy:
    name: Deploy Exam to Docker Swarm
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production

    steps:
      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:github-actions

      - name: Configure SSH
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          test -n "$SSH_PRIVATE_KEY"
          test -n "$SSH_KNOWN_HOSTS"

          printf '%s\n' "$SSH_PRIVATE_KEY" \
            > ~/.ssh/github_actions_siakad

          printf '%s\n' "$SSH_KNOWN_HOSTS" \
            > ~/.ssh/known_hosts

          chmod 600 ~/.ssh/github_actions_siakad
          chmod 600 ~/.ssh/known_hosts

      - name: Check SSH key fingerprint
        shell: bash
        run: |
          set -euo pipefail

          ssh-keygen -y \
            -f ~/.ssh/github_actions_siakad \
            | ssh-keygen -lf -

      - name: Deploy Exam to Swarm
        shell: bash
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ vars.EXAM_SSH_PORT || '1817' }}
        run: |
          set -euo pipefail

          test -n "$SSH_HOST"
          test -n "$SSH_USER"

          ssh \
            -i ~/.ssh/github_actions_siakad \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=15 \
            -p "$SSH_PORT" \
            "$SSH_USER@$SSH_HOST" \
            bash -s <<'REMOTE'

          set -euo pipefail

          IMAGE="taqiussa/smpalfa:exam"
          SERVICE="smpalfa_exam"

          echo "Checking Docker Swarm service"
          docker service inspect "$SERVICE" >/dev/null

          echo "Pulling Docker image: $IMAGE"
          docker pull "$IMAGE"

          echo "Updating Docker Swarm service: $SERVICE"
          docker service update \
            --with-registry-auth \
            --no-resolve-image \
            --force \
            --detach=false \
            --image "$IMAGE" \
            --update-order start-first \
            --update-failure-action rollback \
            "$SERVICE"

          echo "Deployment completed successfully"

          docker service ps "$SERVICE" --no-trunc

          echo "Current service image:"
          docker service inspect "$SERVICE" \
            --format '{{.Spec.TaskTemplate.ContainerSpec.Image}}'

          REMOTE
