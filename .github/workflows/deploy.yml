
name: Deploy SMP Alfa Exam

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: exam-production
  cancel-in-progress: false

jobs:
  build:
    name: Build and Push Docker
    runs-on: ubuntu-latest

    outputs:
      image: ${{ steps.meta.outputs.image }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set image tags
        id: meta
        shell: bash
        run: |
          IMAGE="taqiussa/smpalfa:exam-${GITHUB_SHA}"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Build and Push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            taqiussa/smpalfa:exam
            ${{ steps.meta.outputs.image }}
          cache-from: type=gha,scope=exam
          cache-to: type=gha,mode=max,scope=exam

  deploy:
    name: Deploy Docker Swarm
    needs: build
    runs-on: ubuntu-latest
    environment: production

    steps: 
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        env:
          IMAGE: ${{ needs.build.outputs.image }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 1817
          envs: IMAGE
          command_timeout: 10m
          script: |
            set -eu

            echo "Pull image: $IMAGE"
            docker pull "$IMAGE"

            echo "Update Docker Swarm service"
            docker service update \
              --with-registry-auth \
              --image "$IMAGE" \
              --detach=false \
              smpalfa_exam

            echo "Service deployment completed"
            docker service ps smpalfa_exam \
              --no-trunc

