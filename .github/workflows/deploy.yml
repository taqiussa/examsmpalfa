  deploy:
    name: Deploy Exam to Docker Swarm
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production

    steps:
      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:github-actions

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          test -n "$SSH_PRIVATE_KEY"
          test -n "$SSH_KNOWN_HOSTS"

          printf '%s\n' "$SSH_PRIVATE_KEY" \
            > ~/.ssh/github_actions

          printf '%s\n' "$SSH_KNOWN_HOSTS" \
            > ~/.ssh/known_hosts

          chmod 600 ~/.ssh/github_actions
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy Exam to Swarm
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ vars.EXAM_SSH_PORT || '1817' }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          test -n "$SSH_HOST"
          test -n "$SSH_USER"

          ssh \
            -i ~/.ssh/github_actions \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=15 \
            -p "$SSH_PORT" \
            "$SSH_USER@$SSH_HOST" \
            bash -s -- "$RELEASE_SHA" <<'REMOTE'

          set -euo pipefail

          SHA="$1"
          IMAGE="taqiussa/smpalfa:exam-$SHA"
          SERVICE="smpalfa_exam"

          echo "Checking Docker Swarm service"
          docker service inspect "$SERVICE" >/dev/null

          echo "Pulling image: $IMAGE"
          docker pull "$IMAGE"

          echo "Updating service: $SERVICE"
          docker service update \
            --with-registry-auth \
            --detach=false \
            --image "$IMAGE" \
            --update-order stop-first \
            --update-failure-action rollback \
            "$SERVICE"

          echo "Deployment completed"
          docker service ps "$SERVICE" --no-trunc

          REMOTE
